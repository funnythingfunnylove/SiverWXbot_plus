<style>
#tab-company .company-actions {display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0;}
#tab-company button {padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--card-fg);}
#tab-company button.company-primary {background:var(--primary);color:white;border-color:var(--primary);}
#tab-company button:disabled {opacity:.55;cursor:wait;}
#tab-company button:focus-visible,#tab-company a:focus-visible {outline:2px solid var(--primary);outline-offset:3px;}
#tab-company .company-result {padding:14px 0;border-bottom:1px solid var(--border);overflow-wrap:anywhere;}
#tab-company .company-result:last-child {border-bottom:0;}
#tab-company dl {display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr);gap:10px 16px;}
#tab-company dd {margin:0;white-space:pre-wrap;overflow-wrap:anywhere;}
#tab-company dt {color:var(--muted-fg);font-weight:500;}
#tab-company .company-message {white-space:pre-wrap;overflow-wrap:anywhere;}
#tab-company .company-badge {display:inline-block;padding:4px 10px;border-radius:20px;background:var(--bg);font-size:12px;}
@media(max-width:576px){ #tab-company dl{grid-template-columns:1fr;gap:6px;} #tab-company dd{margin-bottom:10px;}}
</style>
<div class="config-panel" id="tab-company">
  <div class="cfg-card">
    <div class="cfg-card-header"><i class="bi bi-building"></i><h5>企业查询</h5><span class="desc">使用已登录的天眼查账号查询企业资料</span></div>
    <p class="cfg-hint">输入企业名称，选择候选企业后查看工商信息。当前支持第一页搜索和企业详情；查老板与翻页暂未开放。</p>
    <div class="company-actions"><span id="company-connection" class="company-badge">尚未检查连接</span><button type="button" id="company-refresh">刷新连接状态</button></div>
    <label class="cfg-label" for="company-keyword">企业名称或关键词</label>
    <div class="company-actions"><input class="form-control" style="flex:1;min-width:180px;" id="company-keyword" maxlength="100" placeholder="例如：广州谢诺投资集团有限公司"><button type="button" class="company-primary" id="company-search">查询企业</button></div>
    <p id="company-message" class="company-message" role="status" aria-live="polite"></p>
    <div id="company-results"></div>
  </div>
  <div class="cfg-card" id="company-detail-card" hidden>
    <div class="cfg-card-header"><i class="bi bi-card-text"></i><h5 id="company-detail-title">企业详情</h5></div>
    <p id="company-detail-note" class="cfg-hint"></p>
    <dl id="company-detail"></dl>
    <div id="company-source"></div>
  </div>
  <div class="cfg-card">
    <div class="cfg-card-header"><i class="bi bi-browser-chrome"></i><h5>连接天眼查浏览器</h5></div>
    <p class="cfg-hint">首次部署：下载并解压扩展，在 Chrome 的 chrome://extensions 页面开启开发者模式，选择“加载已解压的扩展程序”。登录天眼查后，打开扩展的桥接页面进行连接。查询期间保留桥接页面。</p>
    <div class="company-actions"><a id="company-download" class="btn btn-outline-secondary" href="{{ url_for('company_extension') }}">下载 Chrome 扩展</a><button type="button" id="company-pair">生成新的配对令牌</button><button type="button" id="company-disconnect">撤销浏览器连接</button></div>
    <p class="cfg-hint">生成新令牌或重启后台后，旧连接失效。配对只授权浏览器领取查询任务，不授予后台管理权限。跨电脑连接请通过 HTTPS 访问后台。</p>
    <div id="company-pair-box" hidden>
      <label class="cfg-label" for="company-bridge-url">桥接地址</label><input class="form-control mb-3" id="company-bridge-url" readonly>
      <label class="cfg-label" for="company-pair-token">配对令牌（复制到扩展）</label><input class="form-control" id="company-pair-token" type="password" readonly autocomplete="off">
      <div class="company-actions"><button type="button" id="company-copy-token">复制令牌</button><button type="button" id="company-hide-token">隐藏并清除显示</button></div>
    </div>
    <p id="company-setup-message" class="company-message" role="status" aria-live="polite"></p>
  </div>
</div>
<script defer src="{{ url_for('static', filename='company_panel.js') }}"></script>
